name: Build and Deploy to Container Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Application
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run type checking
      run: npm run build
      env:
        BYPASS_AUTH: true
        NEXT_PUBLIC_DEV_ROLE: managers

    - name: Run tests (if available)
      run: npm test --if-present
      continue-on-error: true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    name: Build and Push Docker Image
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          BYPASS_AUTH=true
          NEXT_PUBLIC_DEV_ROLE=managers

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    name: Deploy to Staging
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Azure Container Instances (Example)
      uses: azure/aci-deploy@v1
      with:
        resource-group: ${{ secrets.AZURE_RG }}
        dns-name-label: irs-error-resolution-staging
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
        registry-login-server: ${{ env.REGISTRY }}
        registry-username: ${{ github.actor }}
        registry-password: ${{ secrets.GITHUB_TOKEN }}
        name: irs-error-resolution-staging
        location: 'east us'
        environment-variables: |
          NODE_ENV=staging
          BYPASS_AUTH=${{ secrets.BYPASS_AUTH_STAGING }}
          NEXT_PUBLIC_DEV_ROLE=${{ secrets.NEXT_PUBLIC_DEV_ROLE_STAGING }}
        secure-environment-variables: |
          DATABASE_URL=${{ secrets.DATABASE_URL_STAGING }}
          API_SECRET=${{ secrets.API_SECRET_STAGING }}

    # Alternative: Deploy to AWS ECS
    # - name: Deploy to AWS ECS
    #   uses: aws-actions/amazon-ecs-deploy-task-definition@v1
    #   with:
    #     task-definition: task-definition.json
    #     service: irs-error-resolution-staging
    #     cluster: staging-cluster
    #     wait-for-service-stability: true

    # Alternative: Deploy to Google Cloud Run
    # - name: Deploy to Google Cloud Run
    #   uses: google-github-actions/deploy-cloudrun@v1
    #   with:
    #     service: irs-error-resolution-staging
    #     image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
    #     region: us-central1
    #     env_vars: |
    #       NODE_ENV=staging
    #       BYPASS_AUTH=${{ secrets.BYPASS_AUTH_STAGING }}

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Azure Container Instances (Example)
      uses: azure/aci-deploy@v1
      with:
        resource-group: ${{ secrets.AZURE_RG }}
        dns-name-label: irs-error-resolution-prod
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        registry-login-server: ${{ env.REGISTRY }}
        registry-username: ${{ github.actor }}
        registry-password: ${{ secrets.GITHUB_TOKEN }}
        name: irs-error-resolution-prod
        location: 'east us'
        environment-variables: |
          NODE_ENV=production
        secure-environment-variables: |
          DATABASE_URL=${{ secrets.DATABASE_URL_PRODUCTION }}
          API_SECRET=${{ secrets.API_SECRET_PRODUCTION }}

    # Alternative: Deploy to Kubernetes
    # - name: Deploy to Kubernetes
    #   uses: azure/k8s-deploy@v1
    #   with:
    #     manifests: |
    #       k8s/deployment.yml
    #       k8s/service.yml
    #     images: |
    #       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  security-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    name: Security Scan
    permissions:
      security-events: write
    
    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
